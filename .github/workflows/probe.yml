name: probe
on: workflow_dispatch
permissions: {contents: read}
concurrency: {group: data-probe, cancel-in-progress: false}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, gzip, collections, time
          A = "https://api.sleeper.app/v1"
          def g(p):
              for i in range(3):
                  try: return json.load(urllib.request.urlopen(urllib.request.Request(A + p, headers={"User-Agent": "hashmark-test"}), timeout=60))
                  except Exception as e: time.sleep(1)
              return None
          st = g("/state/nfl"); season = str(st.get("league_season") or st["season"]); week = max(1, min(18, int(st.get("display_week") or st.get("week") or 1)))
          q = collections.deque([g("/user/jackdixon")["user_id"]]); seen = set(q); best = None; checked = 0
          while q and checked < 4000:
              uid = q.popleft()
              for lg in g(f"/user/{uid}/leagues/nfl/{season}") or []:
                  checked += 1; rp = lg.get("roster_positions") or []; s = lg.get("settings") or {}
                  idp = any(x in rp for x in ("DL", "LB", "DB", "IDP_FLEX"))
                  sc = (2 if idp else 0) + (1 if s.get("reserve_slots") else 0) + (1 if s.get("taxi_slots") else 0) + (1 if s.get("type") == 2 else 0)
                  if idp and (best is None or sc > best[0]): best = (sc, lg)
                  if best and best[0] >= 5: break
                  for m in (g(f"/league/{lg['league_id']}/users") or [])[:12] if len(seen) < 3000 else []:
                      if m["user_id"] not in seen: seen.add(m["user_id"]); q.append(m["user_id"])
                  if best and best[0] >= 5: break
              if best and best[0] >= 5: break
          lg = best[1]; lid = lg["league_id"]
          users = g(f"/league/{lid}/users") or []; rosters = g(f"/league/{lid}/rosters") or []
          umap = {u["user_id"]: f"u{i+1}" for i, u in enumerate(users)}
          FL = "900000000000000001"
          def anon(o):
              s = json.dumps(o)
              for real, fake in umap.items(): s = s.replace(real, fake)
              return json.loads(s.replace(lid, FL))
          lg2 = anon(lg); lg2["name"] = "IDP Test League"; lg2["previous_league_id"] = None; lg2["avatar"] = None
          us2 = [{"user_id": umap[u["user_id"]], "display_name": f"Manager {i+1}", "metadata": {"team_name": f"Team {i+1}"}, "avatar": None} for i, u in enumerate(users)]
          ro2 = anon(rosters)
          me = next((r["owner_id"] for r in ro2 if r.get("owner_id")), "u1")
          F = {"/state/nfl": st, f"/user/testuser": {"user_id": me, "username": "testuser", "display_name": "testuser"}, f"/user/{me}/leagues/nfl/{season}": [lg2],
               f"/league/{FL}": lg2, f"/league/{FL}/users": us2, f"/league/{FL}/rosters": ro2, f"/league/{FL}/traded_picks": anon(g(f"/league/{lid}/traded_picks") or [])}
          for w in range(1, 19): F[f"/league/{FL}/matchups/{w}"] = anon(g(f"/league/{lid}/matchups/{w}") or [])
          for r in range(1, week + 1): F[f"/league/{FL}/transactions/{r}"] = []
          ids = set()
          for r in rosters: ids |= set((r.get("players") or []) + (r.get("reserve") or []) + (r.get("taxi") or []))
          for w in range(1, week + 1):
              s_ = g(f"/stats/nfl/regular/{season}/{w}") or {}; F[f"/stats/nfl/regular/{season}/{w}"] = s_
              ids |= {k for k, v in (s_.items() if isinstance(s_, dict) else []) if (v or {}).get("gp")}
          F[f"/projections/nfl/regular/{season}/{week}"] = g(f"/projections/nfl/regular/{season}/{week}") or {}
          for y in range(2020, int(season)): F[f"/stats/nfl/regular/{y}"] = g(f"/stats/nfl/regular/{y}") or {}
          P = g("/players/nfl"); F["/players/nfl"] = {k: v for k, v in P.items() if k in ids or v.get("position") in ("QB", "RB", "WR", "TE", "K", "DEF") and v.get("team")}
          F["/players/nfl/trending/add?lookback_hours=24&limit=50"] = []
          F["_meta"] = {"season": season, "week": week, "rp": lg2.get("roster_positions"), "settings": lg2.get("settings"), "me": me}
          json.dump(F, gzip.open("fixture.json.gz", "wt"))
          print(F["_meta"])
          PY
      - uses: actions/upload-artifact@v4
        with: {name: fixture, path: fixture.json.gz, retention-days: 1}
