name: refresh-news
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: data-commit, cancel-in-progress: false}
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/build_news.py
      - run: |
          git config user.name hashmark-bot; git config user.email bot@users.noreply.github.com
          git add data/news.json
          git diff --staged --quiet && exit 0
          git commit -m "news refresh"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
