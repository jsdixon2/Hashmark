name: league-archive
on:
  push:
    paths: ["scripts/fetch_leagues.py", ".github/workflows/leagues.yml"]
  schedule: [{cron: "23 11 * * 2"}]
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: data-commit, cancel-in-progress: false}
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/fetch_leagues.py
        env: {MAX_LEAGUES: "700"}
      - run: |
          git config user.name hashmark-bot; git config user.email bot@users.noreply.github.com
          git add bt/
          git diff --staged --quiet && exit 0
          git commit -m "backtest archive: anonymous league matchups"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
