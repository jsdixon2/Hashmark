name: refresh-data
on: {schedule: [{cron: "0 9,15 * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
concurrency: {group: data-commit, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/build_data.py
      - run: python3 scripts/build_adv.py || true
      - run: python3 scripts/build_values.py || true
        env: {ROSTERAUDIT_KEY: "${{ secrets.ROSTERAUDIT_KEY }}"}
      - run: python3 scripts/build_cfb.py || true
        env: {CFBD_API_KEY: "${{ secrets.CFBD_API_KEY }}"}
      - run: |
          git config user.name hashmark-bot; git config user.email bot@users.noreply.github.com
          for f in data/nfl.json data/adv.json data/cfb.json data/values.json data/cfbd_cache.json; do [ -f $f ] && git add $f; done; git diff --staged --quiet || (git commit -m "data refresh" && (git pull --rebase -q origin main; git push))
