name: refresh-data
on: {schedule: [{cron: "0 9 * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_data.py
      - run: |
          git config user.name hashmark-bot; git config user.email bot@users.noreply.github.com
          git add data/nfl.json; git diff --staged --quiet || (git commit -m "data refresh" && git push)
