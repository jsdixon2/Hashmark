name: backtest-data
on:
  push:
    paths: ["scripts/fetch_bt.py", ".github/workflows/backtest.yml"]
  schedule: [{cron: "17 9 * * 2"}]
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: data-commit, cancel-in-progress: false}
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/fetch_bt.py
      - run: |
          git config user.name hashmark-bot; git config user.email bot@users.noreply.github.com
          git add bt/
          git diff --staged --quiet && exit 0
          git commit -m "backtest archive: Sleeper weekly projections"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
