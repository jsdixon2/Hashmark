.top{display:flex}
.back{flex:none;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;color:var(--ink);padding:0}

@media (max-width:520px){.jump kbd{display:none}.mode span{display:none}.mode{padding:8px}}
html{-webkit-tap-highlight-color:transparent}
button,.tap,.pr,[role=link]{touch-action:manipulation}

:root{--fd:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;--fb:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;--bg:#F2F2F7;--panel:#fff;--panel2:#E5E5EA;--line:#D1D1D6;--ink:#000;--muted:#6C6C70;--amber:#48484A;--ice:#1C1C1E;--rose:#8E8E93;--mint:#3A3A3C;--violet:#636366;--onacc:#fff;--glowA:transparent;--glowB:transparent}

async function loadNV(){try{const r=await fetch("data/nfl.json");if(!r.ok)return;const d=await r.json();NV=d;const a={};for(const [id,o] of Object.entries(d.p)){const p=PL[id];if(!p)continue;let G=0,T=0;for(const v of Object.values(o.s)){G+=v[0];T+=v[1];}const m=a[p.pos]=a[p.pos]||[0,0];m[0]+=G;m[1]+=T;}NVM={};for(const k in a)NVM[k]=a[k][1]/a[k][0];render();}catch(e){}}
function neutral(p){const o=NV&&NV.p[p.id];if(!o)return null;let G=0,T=0;for(const v of Object.values(o.s)){G+=v[0];T+=v[1];}if(!G)return null;const m=NVM[p.pos]||10,k=8;return {ppg:(T+k*m)/(G+k),raw:T/G,G,sd:o.sd,o};}
const rosN=p=>{const n=neutral(p);return n?n.ppg*((S.L&&S.L.remWeeks)||10):p.ros;};
function nvPanel(id){const p=PL[id],n=p&&neutral(p);if(!n)return "";const o=n.o,cur=o.s[String(S.season)],ok=cur&&p.pts!=null?Math.abs(cur[1]-p.pts)/Math.max(p.pts,1)<.05:null;
  return `<section class="pan mt"><h2>Career numbers, every season equal</h2><p class="sub">Neutral rating weights every game the same, then pulls small samples toward the position average.</p>
  <div class="grid4 mt"><div><div class="num">${f1(n.ppg)}</div><div class="sub">Neutral PPG</div></div><div><div class="num">${f1(n.raw)}</div><div class="sub">Raw PPG, ${n.G} games</div></div><div><div class="num">${n.sd??"–"}</div><div class="sub">Weekly spread</div></div><div><div class="num">${o.ecr1?o.ecr1.toFixed(1):"–"}</div><div class="sub">Expert rank${o.ecr2?`, SF ${o.ecr2.toFixed(1)}`:""}</div></div></div>
  <div class="tw mt"><table><thead><tr><th>Season</th><th>Games</th><th>PPR</th><th>PPG</th><th>Targets</th><th>Carries</th></tr></thead><tbody>${Object.entries(o.s).map(([y,v])=>`<tr><td>${y}</td><td>${v[0]}</td><td>${v[1]}</td><td>${f1(v[1]/v[0])}</td><td>${v[2]}</td><td>${v[3]}</td></tr>`).join("")}</tbody></table></div>
  <p class="sub mt">${ok==null?"":ok?"Sleeper and nflverse agree on this season’s points.":"Sleeper and nflverse differ by over 5% this season; treat the total with care."} Sources: nflverse (CC-BY 4.0), DynastyProcess ranks, data as of ${esc(NV.asof)}. ${o.espn&&o.espn!=="NA"?`<a href="https://www.espn.com/nfl/player/_/id/${esc(o.espn)}" target="_blank" rel="noopener">ESPN profile</a>`:""}</p></section>`;}

async function loadTxns(L){const out=[];const rs=[...Array(Math.max(1,S.week)).keys()].map(i=>i+1);const all=await Promise.all(rs.map(r=>sj(`${API}/league/${L.id}/transactions/${r}`).catch(()=>[])));for(const a of all)for(const t of a||[])out.push(t);L.tx=out.sort((a,b)=>b.created-a.created);}
const pnm=id=>PL[id]?PL[id].name:(LIVE&&LIVE.players&&LIVE.players[id]?((LIVE.players[id].first_name||"")+" "+(LIVE.players[id].last_name||"")).trim():"Player "+id);

function faabRows(L){const b=+L.lset.waiver_budget,rem=L.remWeeks||10;const w=(L.tx||[]).filter(t=>t.type==="waiver"&&t.status==="complete"&&t.settings&&t.settings.waiver_bid!=null);const rows=[];
  for(const t of w)for(const pid in t.adds||{}){const p=PL[pid];if(!p)continue;const n=neutral(p),ppg=n?n.ppg:(p.ppg||0);rows.push({p,team:t.adds[pid],bid:t.settings.waiver_bid,par:(ppg-repl(p.pos))*rem});}
  if(rows.length<3)return {rows,steal:[],rob:[],over:[],bust:[]};const q=(a,f)=>[...a].sort((x,y)=>f(x)-f(y));const bi=q(rows,r=>r.bid),pi=q(rows,r=>r.par);const lo=bi[Math.floor(rows.length*.4)].bid,hi=bi[Math.floor(rows.length*.6)].bid,pl=pi[Math.floor(rows.length*.4)].par,ph=pi[Math.floor(rows.length*.6)].par;
  return {rows,rob:rows.filter(r=>r.par>=pi[Math.floor(rows.length*.8)].par&&r.bid<=Math.max(1,b*.02)).sort((x,y)=>y.par-x.par).slice(0,5),steal:rows.filter(r=>r.par>=ph&&r.bid<=lo).sort((x,y)=>y.par/(y.bid+1)-x.par/(x.bid+1)).slice(0,5),over:rows.filter(r=>r.bid>=hi&&r.par<=pl).sort((x,y)=>y.bid-x.bid).slice(0,5),bust:rows.filter(r=>r.par<=0&&r.bid>0).sort((x,y)=>y.bid-x.bid).slice(0,5)};}
function vFaab(){const L=S.L;if(!L||L.demo)return `<section class="pan mt"><h2>Waiver rules</h2><p class="sub">Connect your Sleeper account to see waiver priority, FAAB balances and transaction history.</p></section>`;

function vTx(){const L=S.L;if(!L||L.demo)return `<h1>Transactions</h1><p class="sub">Connect Sleeper to see this league’s history.</p>`;if(!L.tx)return `<h1>Transactions</h1><p class="sub">Loading…</p>`;

const cl2=(x,a,b)=>Math.max(a,Math.min(b,x)),PCT=x=>Math.round(x*100);
const mineIdx=L=>Math.max(0,L.teams.findIndex(t=>t.mine));

function ring(p,sub){const r=52,c=2*Math.PI*r,d=(c*cl2(p,0,1)).toFixed(1);return `<svg class="ring" viewBox="0 0 132 132" width="132" height="132" role="img" aria-label="${PCT(p)} percent win probability"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="12"/><circle class="arc" cx="66" cy="66" r="${r}" fill="none" stroke="var(--ink)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${d} ${c.toFixed(1)}" transform="rotate(-90 66 66)"/><text class="rt" x="66" y="76" text-anchor="middle" data-cu="${PCT(p)}" data-sfx="%">${PCT(p)}%</text></svg><div class="rv">${esc(sub)}</div>`;}

function spark(vals,w=96,h=28){if(!vals||vals.length<2)return "";const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1,X=i=>2+i*(w-4)/(vals.length-1),Y=v=>h-3-(v-mn)/r*(h-6);return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${vals.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(vals[vals.length-1]).toFixed(1)}" r="2.6" fill="var(--ink)"/></svg>`;}
function probStrip(L,bar){const M=myMatchup(L);if(!M)return `<p class="sub">No matchup this week.</p>`;const a=M.A,b=M.B,live=x=>x.live!=null&&x.live>0,sh=x=>f1(live(x)?x.live:x.proj),cap=x=>live(x)?`live · proj ${f1(x.proj)}`:"projected";

function kpiRow(L){const o=oddsFor(L),me=mineIdx(L),t=L.teams[me],ord=L.teams.map((_,i)=>i).sort((a,b)=>o[b].str-o[a].str),pr=ord.indexOf(me)+1;

function gapRows(t){return t.players.map(i=>PL[i]).filter(p=>p&&p.ppg!=null&&POSI.hasOwnProperty(p.pos)).map(p=>{const n=neutral(p),exp=n?n.ppg:rosPPG(p);return {p,pace:p.ppg,exp,gap:p.ppg-exp,thr:Math.max(1.5,exp*.15)};}).sort((a,b)=>b.p.val-a.p.val).slice(0,8);}

function perfSeries(L,t){const ps=t.players.map(i=>PL[i]).filter(p=>p&&p.log&&p.log.length);if(ps.length<5)return null;const wks=[...new Set(ps.flatMap(p=>p.log.map(x=>x.wk)))].sort((a,b)=>a-b);if(wks.length<3)return null;const order=[...L.slots].sort((a,b)=>ELIG[a].length-ELIG[b].length);

gateShow(LS.get("hm_user")?"restore":"form");
probeLive().then(ok=>{S.canLive=ok;if(!ok){gateShow("form");return;}const u=LS.get("hm_user");if(u&&S.mode!=="live")connectSleeper(u).then(()=>{gateHide();go("home");render();}).catch(()=>gateShow("form"));else gateShow("form");});
