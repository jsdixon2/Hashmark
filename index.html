.top{display:flex}

html{-webkit-tap-highlight-color:transparent}

:root{--fd:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;--fb:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;--bg:#F2F2F7;--panel:#fff;--panel2:#E5E5EA;--line:#D1D1D6;--ink:#000;--muted:#6C6C70;--amber:#48484A;--ice:#1C1C1E;--rose:#8E8E93;--mint:#3A3A3C;--violet:#636366;--onacc:#fff;--glowA:transparent;--glowB:transparent}

  let bal="";if(T.a.length&&T.b.length&&ag>=.05){const need=Math.abs(B-A);const fromTeam=L?(gap>0?(T.ta!=null?L.teams[T.ta]:null):(T.tb!=null?L.teams[T.tb]:null)):null;const inT=new Set([...T.a,...T.b]);

    <div class="field mt"><input data-tq="${k}" placeholder="Add a player${ti!=null&&L?" from "+esc(L.teams[ti].name):""}" aria-label="${ttl}: search players"></div><div data-tr="${k}"></div>

/* sustainability: real breakout vs flash in the pan (0 = flash, 1 = real) */
function sustain(p){const f=p._rf||{},c=p.rc||{},n=(p.log||[]).length;let s=.35;
  s+=Math.min(1,n/8)*.15;
  if(f.snap!=null&&p.pos!=="QB")s+=f.snap>=75?.18:f.snap>=60?.08:f.snap<45?-.15:0;
  if(f.tdp!=null){const norm=p.pos==="QB"?.32:.24;s+=f.tdp<=norm?.12:-Math.min(.3,(f.tdp-norm)*1.1);}
  if(c.vol!=null)s+=(50-c.vol)/50*.1;if(f.tr!=null)s+=f.tr<-.1?.1:f.tr>.15?-.1:0;
  if(p.age!=null){const cl=AGE_CLIFF[p.pos]||29;s+=p.age<=25?.08:p.age>=cl?-.06:0;}
  if(p.dc===1)s+=.05;if(p.news&&p.news.m<.95)s-=.1;
  return Math.max(0,Math.min(1,s));}
function sustainWhy(p){const f=p._rf||{},x=[];if(f.snap!=null&&p.pos!=="QB")x.push(`${Math.round(f.snap)}% of snaps lately`);if(f.tdp!=null)x.push(`${Math.round(f.tdp*100)}% of points from TDs`);if((p.log||[]).length)x.push(`${p.log.length} games`);return x.join(", ");}

  return r.gap<=-r.thr?`<span class="pill hot">${mine?"Due to rise":"Buy low"}</span>`:`<span class="pill">Fair</span>`;}

/* team context per league: status, lineup baseline, needs, injuries, depth, picks */
const remW=L=>Math.max(1,L.remWeeks||Math.max(1,18-(S.week||1)));
function futPts(p,reb){if(!p||S.fmt.type==="redraft")return 0;const b=Math.max(0,rosPPG(p)),a=p.age||26,m0=ageMult(p.pos,a)||1,cl=AGE_CLIFF[p.pos]||29,W=reb?[.4,1,1]:[1,.65,.4];let v=0;for(let k=1;k<=3;k++){let r=Math.min(1.3,ageMult(p.pos,a+k)/m0);if(a+k>cl)r*=Math.max(.05,1-(a+k-cl)*.35);v+=b*r*14*W[k-1];}return v*(S.fmt.type==="keeper"?.45:1);}
function lpts(ids,L){return lineup(ids,L.slots).pts;}
function leagueCtx(L){const key=L.id+"|"+S.week+"|"+Object.keys(PL).length+"|"+(NW.built||0)+"|"+L.teams.map(t=>t.players.length+":"+t.w).join(",");if(L._ctx&&L._ctx.k===key)return L._ctx.v;
  const v=L.teams.map((t,ti)=>{let ts;try{ts=teamStatus(L,ti);}catch(e){ts={st:"balanced",rank:ti+1,po:.5,n:L.teams.length,dyn:S.fmt.type!=="redraft",wNow:.5};}
    const lu=lineup(t.players,L.slots),st=new Set(lu.out.filter(x=>x.p).map(x=>x.p.id));let nd=[];try{nd=needs(L,t);}catch(e){}
    const nd2={};nd.forEach(x=>nd2[x.pos]=x.d);const hurt=lu.out.filter(x=>x.p&&x.p.inj&&ABS.test(x.p.inj)).length;
    const depth={};for(const id of t.players){const p=PL[id];if(p&&!st.has(id)&&POSI.hasOwnProperty(p.pos)&&rosPPG(p)>=repl(p.pos)*.8)depth[p.pos]=(depth[p.pos]||0)+1;}

const recOf=t=>`${t.w}-${t.l}${t.t?"-"+t.t:""}`;

tradeSignals=function(L){const C=leagueCtx(L),mi=mineIdx(L),me=C[mi],ts=me.ts,ctx=sigCtx(),rem=remW(L);const myNeed=Object.entries(me.nd).sort((a,b)=>a[1]-b[1])[0];
  const buys=[],sells=[];
  // BUY: players on other rosters whose value to you beats their value to their owner
  for(const c of C){if(c.ti===mi)continue;for(const id of c.t.players){const p=PL[id];if(!p||!POSI.hasOwnProperty(p.pos))continue;if(rosPPG(p)<3&&(p.val||0)<ctx.long[Math.floor(ctx.long.length*.6)])continue;
    const mine=valIn(L,me,p),theirs=valOut(L,c,p),g=playerSignal(p,ctx,ts);const edge=mine.v-theirs.v,scale=Math.max(25,mine.v,theirs.v);let s=edge/scale*2.2;const why=[];
    if(mine.g>=.8)why.push(`+${f1(mine.g)} pts a week to your starting lineup${myNeed&&p.pos===myNeed[0]&&myNeed[1]<0?` at ${p.pos}, your thinnest spot`:""}`);
    else if(me.w>.6){s-=.6;}
    if(me.w<.5){const fp=futPts(p,true);if(fp>=120&&(p.age||30)<=26){s+=.4;why.push(`${Math.round(fp)} projected points over the next 3 seasons at age ${p.age}`);}if(p.age!=null&&p.age>=(AGE_CLIFF[p.pos]||29)){s-=.9;}}

    if(c.ts.st==="rebuilding"&&me.w>.6&&p.age!=null&&p.age>=(AGE_CLIFF[p.pos]||29)-1){s+=.5;why.push(`${c.t.name} is ${recOf(c.t)} and rebuilding; a ${p.age}-year-old is worth more to you than to them`);}
    if(c.ts.st==="contender"&&me.w<.5&&c.hurt>=2){s+=.3;why.push(`${c.t.name} is contending with ${c.hurt} injured starters and may pay for help`);}

    else if(g.ret.pct>=3){s+=g.ret.pct/14;why.push(g.ret.why.find(x=>x.v>0).t);}

    if(g.pre&&(me.w<.75)){s+=.5*Math.min(1,g.brk/.45);why.push(`${PCT(g.brk)}% breakout odds while priced mid-tier`);}
    const myExtra=Object.entries(me.depth).filter(([ps,n])=>n>=2&&(c.nd[ps]||0)<-.5).map(([ps])=>ps);if(myExtra.length){s+=.2;why.push(`${c.t.name} is thin at ${myExtra[0]}, where you have depth to send`);}

  for(const b of buys.slice(0,8)){const c=b.c,need=b.theirs.v*.8,pB=lpts(c.t.players.filter(x=>x!==b.p.id),L);let best=null;
    for(const q of myPl){if(q.id===b.p.id)continue;const gT=Math.max(0,lpts(c.t.players.filter(x=>x!==b.p.id).concat(q.id),L)-pB),vT=c.w*gT*rem+(1-c.w)*futPts(q,c.w<.45);if(vT<need)continue;const cost=valOut(L,me,q).v;const sc=vT-cost*1.3;if(!best||sc>best.sc)best={q,sc,vT,cost};}

    if(best.v.g>=1.5)why.push(`Worth +${f1(best.v.g)} pts a week to ${best.c.t.name} (${recOf(best.c.t)}, ${stLbl(best.c)})`);

/* ---------- guillotine board ---------- */
function glRows(L){const mu=L.glMu||[];const alive=new Set(mu.map(m=>m.rid));const rows=[];
  L.teams.forEach((t,ti)=>{if(!alive.has(t.id)){rows.push({t,ti,dead:true});return;}const m=mu.find(x=>x.rid===t.id);let W=null;try{W=teamWeek(L,ti,{starters:m.st||[],pts:m.pts});}catch(e){}
    const live=m.pts||0,proj=W?W.proj:0;let yet=0,tot=0;if(W&&W.rows)for(const r of W.rows){if(!r.p)continue;tot++;const pp=(m.pp||{})[r.p.id];if(!(pp>0))yet++;}
    const frac=tot?yet/tot:1,mean=live>0?live+proj*frac:proj,sd=4+22*Math.sqrt(frac);rows.push({t,ti,live,proj,mean,sd,frac});});
  const al=rows.filter(r=>!r.dead);const N=2000,chop=new Array(al.length).fill(0);

    <div class="row sp sub"><span>${Math.round((1-r.frac)*100)}% of lineup played</span><span class="tag ${tier(r)[1]}">${PCT(r.pc)}% chop</span></div></div>`;

  ${ripMe?`<section class="pan"><div class="ripm" style="margin-top:0">R.I.P.</div><p class="sub">You’ve been chopped. Here’s who’s next.</p></section>`:""}
  <section class="pan mt"><div class="row sp"><h2>Chopping block</h2><span class="tag">${al.length} alive</span></div><p class="sub">Solid bar: live score. Shaded band: likely final range; tick: projected final. Chop odds come from 2,000 simulations of the rest of this week.</p>${al.slice().sort((a,b)=>a.pc-b.pc).map(bar).join("")||`<p class="sub">No scores yet this week.</p>`}</section>
  <section class="pan mt"><h2>Outlook</h2>${order.filter(k=>grp[k]).map(k=>`<div class="glg"><span class="tag ${tier(grp[k][0])[1]}">${k}</span><span>${grp[k].map(r=>esc(r.t.name)+(r.t.mine?" (you)":"")).join(", ")}</span></div>`).join("")}</section>

const DEFS={

  yv:["Value to you","Market value adjusted for your roster. A player who would start for you and fill a thin spot is worth more to you than the market says; a player stuck on your bench is worth less. Range: half to 1.6× market."],
  conf:["Confidence","How much the value could move. High: sources agree, healthy, secure role. Medium: one open question. Low: sources disagree, an injury with no clear timeline, or an unproven role."],

/* ---------- teammate-return wording ---------- */
const RECOV=[[/hamstring/i,"2–4 weeks"],[/high ankle/i,"4–6 weeks"],[/ankle/i,"1–3 weeks"],[/groin|quad|calf/i,"2–3 weeks"],[/concussion/i,"1–2 weeks"],[/knee/i,"2–4 weeks"],[/shoulder|ac joint/i,"2–4 weeks"],[/rib|oblique|back/i,"1–3 weeks"],[/foot|toe|turf/i,"2–5 weeks"],[/hip|hand|wrist|thumb|finger/i,"1–3 weeks"],[/illness/i,"under a week"]];
function lastPlayedWk(q){const a=advOf(q);const w=(a&&a.w||[]).filter(x=>x[1]!=null).map(x=>x[0]);const lg=(q.log||[]).map(x=>x.wk);const all=w.concat(lg);return all.length?Math.max(...all):null;}
function headlineTimeline(q){if(!NW.items.length)return null;const ln=q.name.split(" ").slice(-1)[0];for(const it of NW.items){if(!it.t.includes(ln))continue;const m=(it.t+" "+(it.s||"")).match(/(\d+)\s*(?:-|–|to)\s*(\d+)\s*weeks|out (?:at least )?(\d+) weeks|(week-to-week|day-to-day|out for the season|season-ending)/i);if(m)return m[0].toLowerCase();}return null;}
returnEffect=function(p){const o={pct:0,why:[]},st=q=>statusWord(q.inj).replace(/^is /,"");
  for(const q of Object.values(PL)){if(q.team!==p.team||q.id===p.id||!q.inj||!ABS.test(q.inj))continue;if(!(q.pos==="QB"||q.val>=p.val*.5))continue;const ln=q.name.split(" ").slice(-1)[0];
    if(q.pos==="QB"&&p.pos!=="QB"){o.pct+=8;o.why.push({v:8,t:`${q.name} is ${st(q)}; the passing game should improve when he returns`});continue;}
    if(q.pos!==p.pos||p.pos==="QB"){if(p.pos!=="QB"){o.pct+=3;o.why.push({v:3,t:`${q.name} is ${st(q)}; the offense opens up when he returns`});}continue;}
    const hi=q.val>p.val*.8;if(!hi){o.pct-=3;o.why.push({v:-3,t:`${q.name} is ${st(q)} but doesn’t threaten his role`});continue;}
    const a=advOf(q)||{},ir=/\bIR\b|injured reserve/i.test(q.inj),hl=headlineTimeline(q),lp=lastPlayedWk(q);
    const share=[a.ts!=null&&p.pos!=="RB"?`${Math.round(a.ts*100)}% of targets`:null,p.pos==="RB"&&a.snap!=null?`${Math.round(a.snap)}% of snaps`:null,a.rzshare!=null?`${Math.round(a.rzshare*100)}% of red-zone looks`:null].filter(Boolean);
    const lose=p.pos==="RB"?"carries and goal-line work":"targets and red-zone targets";
    let when;if(ir){when=`${ln} is eligible to return Week ${lp!=null?lp+5:"(after 4 games)"} (IR minimum 4 games)${hl?`; reports say ${hl}`:""}`;}
    else{const body=(q.inj.match(/\(([^)]+)\)/)||[])[1]||"";const rc=(RECOV.find(([rx])=>rx.test(body))||[])[1];when=hl?`Reports say ${ln} is ${hl}`:rc?`Typical recovery from a ${body.toLowerCase()} injury is ${rc}`:`${ln}’s timeline is unclear`;}
    o.pct-=9;o.why.push({v:-9,t:`Temporary uptick in volume while ${q.name} ${ir?"sits on IR":"is out"}. ${when}; before the injury he drew ${share.length?share.join(" and "):"a lead role"}, so expect a decrease in ${lose}.`});}
  o.pct=Math.max(-14,Math.min(14,o.pct));return o;};

/* ---------- market value engine ---------- */
let VAL={v:{},sources:[],asof:null};
async function loadValues(){try{const r=await fetch("data/values.json?t="+Math.floor(Date.now()/36e5),{cache:"no-store"});if(!r.ok)return;const j=await r.json();if(!j||!j.v)return;VAL=j;VRK=null;
  computeAll();for(const l of S.leagues){l._sum=null;l._ctx=null;l._dg=null;l._tr=null;l._yv=null;}render();}catch(e){}}
const VANCH=[[1,10000],[12,7000],[50,4000],[150,1500],[300,500],[600,150],[1500,40],[4000,5]];
function curve(rank){if(rank<=1)return 10000;for(let i=1;i<VANCH.length;i++){const [r1,v1]=VANCH[i-1],[r2,v2]=VANCH[i];if(rank<=r2){const t=(Math.log(rank)-Math.log(r1))/(Math.log(r2)-Math.log(r1));return Math.exp(Math.log(v1)+t*(Math.log(v2)-Math.log(v1)));}}return 5;}
let VRK=null;
function srcRank(key){VRK=VRK||{};if(VRK[key])return VRK[key];const isRank=/^ecr_/.test(key);const xs=Object.entries(VAL.v).filter(([,v])=>v[key]!=null&&(isRank||v[key]>0)).sort((a,b)=>isRank?a[1][key]-b[1][key]:b[1][key]-a[1][key]);
  const m={};if(isRank)xs.forEach(([id,v])=>m[id]=v[key]);else xs.forEach(([id],i)=>m[id]=i+1);return VRK[key]=m;}
const SRCN={dd:"Dynasty Dealer",dd_1q:"Dynasty Dealer",dd_rd_sf:"Dynasty Dealer",dd_rd_1q:"Dynasty Dealer",fc_sf:"FantasyCalc",fc_1q:"FantasyCalc",fc_rd_sf:"FantasyCalc",fc_rd_1q:"FantasyCalc",ra_sf:"RosterAudit",ra_1q:"RosterAudit",dp_sf:"DynastyProcess",dp_1q:"DynastyProcess",ecr_dsf:"FantasyPros",ecr_d:"FantasyPros",ecr_ros:"FantasyPros",ecr_wk:"FantasyPros",model:"Hashmark model"};
function srcSets(){const sf=S.fmt.qb==="sf",hasDD1=Object.values(VAL.v).some(v=>v.dd_1q!=null&&v.dd!=null&&v.dd_1q!==v.dd);
  const dyn=[[sf?"dd":hasDD1?"dd_1q":null,.25],[sf?"fc_sf":"fc_1q",.25],[sf?"dp_sf":"dp_1q",.2],[sf?"ra_sf":"ra_1q",.1],[sf?"ecr_dsf":"ecr_d",.1],["model",.2]].filter(x=>x[0]);
  const ros=[[sf?"dd_rd_sf":"dd_rd_1q",.22],[sf?"fc_rd_sf":"fc_rd_1q",.22],["ecr_ros",.18],["model",.38]];
  return {dyn,ros};}
function blendFor(p,set,modelRank){const parts=[];for(const [k,w] of set){let r=null;if(k==="model")r=modelRank;else{const m=srcRank(k);r=m[p.id]??null;}if(r==null)continue;
  if(k==="dd"&&S.fmt.qb!=="sf"&&p.pos==="QB")continue;parts.push({k,w,r,v:curve(r)});}
  if(!parts.length)return null;const W=parts.reduce((s,x)=>s+x.w,0);const v=parts.reduce((s,x)=>s+x.v*x.w,0)/W;
  const ext=parts.filter(x=>x.k!=="model");let cv=null;if(ext.length>=2){const m=ext.reduce((s,x)=>s+x.v,0)/ext.length;cv=Math.sqrt(ext.reduce((s,x)=>s+(x.v-m)**2,0)/ext.length)/Math.max(1,m);}
  return {v,parts,cv,n:ext.length};}
const INJ_UNC=/blood clot|\bdvt\b|thrombo|heart|cardiac|\bneck\b|spinal|spine|undisclosed|mental health|retire/i;
const INJ_MAJ=/\bacl\b|achilles|\btorn\b|rupture|season-ending|fracture|broken|lisfranc|surgery|out for (?:the )?season/i;
function injClass(p){const txt=[p.inj||"",...(NW.items||[]).filter(it=>it.ts&&Date.now()-it.ts<21*864e5&&it.t.includes(p.name)).map(it=>it.t+" "+(it.s||""))].join(" | ");
  if(!p.inj&&!(p.news&&p.news.rep))return null;
  if(INJ_UNC.test(txt))return {c:"unc",lab:"Uncertain injury",lo:.45,hi:1,long:.72,why:(txt.match(INJ_UNC)||[""])[0]};
  if(INJ_MAJ.test(txt)||/\bIR\b/.test(p.inj||"")&&/knee|achilles|foot/i.test(p.inj||"")){const w=(txt.match(INJ_MAJ)||[""])[0].toLowerCase();const f=/achilles/.test(w)?.75:/acl|torn|rupture/.test(w)?.85:/fracture|broken/.test(w)?.93:.88;return {c:"maj",lab:"Major injury, known path back",long:f*((p.age||25)>=28?.93:1),why:w||"IR"};}
  return {c:"min",lab:"Minor injury, full recovery expected",long:1,why:((p.inj||"").match(/\(([^)]+)\)/)||[])[1]||"day-to-day"};}
function drasticCause(p){const xs=(NW.items||[]).filter(it=>it.ts&&Date.now()-it.ts<10*864e5&&it.t.includes(p.name));
  for(const it of xs){const t=it.t;if(/arrest|charged with|indicted|convicted/i.test(t))return `Legal: “${t}”`;if(/season-ending|out for (?:the )?season|torn (?:acl|achilles)/i.test(t))return `Season-altering injury: “${t}”`;if(/\breleased\b|\bwaived\b|\bcut\b/i.test(t)&&p.team==="FA")return `Released: “${t}”`;if(/\bbenched\b|demoted/i.test(t))return `Lost his job: “${t}”`;}
  const ic=injClass(p);if(ic&&ic.c==="unc")return `Uncertain injury (${ic.why})`;return null;}
function fmtMult(p,rank){let m=1;const L=S.L,sc=L&&L.scoring||{};const te=+sc.bonus_rec_te||0;if(p.pos==="TE"&&te>0)m*=1+Math.min(.3,te*.25);

function valueEngine(){const ps=Object.values(PL).filter(p=>POSI.hasOwnProperty(p.pos));if(!ps.length)return;

    const rank=ty==="redraft"?p._rr:(L&&L.parts.length?Math.round(L.parts.reduce((s,x)=>s+x.r*x.w,0)/L.parts.reduce((s,x)=>s+x.w,0)):p._mr);

const eff=vs=>vs.slice().sort((a,b)=>b-a).reduce((s,v,i)=>s+v*Math.pow(.88,i),0);
function calcEval(){const L=S.L,K=S.calc,sides=K.sides.filter(x=>x!=null);if(sides.length<2||!K.assets.length)return null;
  return sides.map(ti=>{const inA=K.assets.filter(a=>a.to===ti),outA=K.assets.filter(a=>a.from===ti);const inV=inA.map(a=>assetVal(a,L,ti)),outV=outA.map(a=>{if(a.k==="k")return assetVal(a,L,ti);const p=PL[a.id];return p?implied(L,ti,p,true):0;});
    const mIn=inA.reduce((s,a)=>s+assetVal(a,L,null),0),mOut=outA.reduce((s,a)=>s+assetVal(a,L,null),0);const eIn=eff(inV),eOut=eff(outV),raw=inV.reduce((s,v)=>s+v,0)-outV.reduce((s,v)=>s+v,0);

    const t=L.teams[ti],ids=t.players.filter(id=>!outA.some(a=>a.k==="p"&&a.id===id)).concat(inA.filter(a=>a.k==="p").map(a=>a.id));const d=lpts(ids,L)-lpts(t.players,L);

function calcInsights(R){const L=S.L,C=leagueCtx(L),out=[];for(const r of R){const c=C[r.ti],nm=r.t.name;
  if(Math.abs(r.lu)>=.3)out.push(`${nm}: ${r.lu>0?"+":""}${f1(r.lu)} projected points a week in their best lineup.`);
  const filled=r.inA.filter(a=>a.k==="p").map(a=>PL[a.id]).filter(p=>p&&(c.nd[p.pos]||0)<-.5);if(filled.length)out.push(`${nm}: ${filled[0].name} fills their thinnest spot (${filled[0].pos}).`);
  if(S.fmt.type!=="redraft"){const ag=xs=>{const a=xs.filter(a=>a.k==="p").map(a=>PL[a.id]).filter(p=>p&&p.age);return a.length?a.reduce((s,p)=>s+p.age,0)/a.length:null;};const ai=ag(r.inA),ao=ag(r.outA);if(ai!=null&&ao!=null&&Math.abs(ai-ao)>=1.5)out.push(`${nm} gets ${f1(Math.abs(ai-ao))} years ${ai<ao?"younger":"older"} at the traded spots, which ${ai<ao===(c.ts.st==="rebuilding")?"fits":"cuts against"} a ${statusLbl(c).toLowerCase()} team.`);}

  const rost=new Set(L.teams.flatMap(t=>t.players));const us=Object.values(PL).filter(p=>p.adv&&p.pos!=="QB"&&(rost.has(p.id)||rosPPG(p)>=4)).map(p=>{const a=p.adv;const dt=a.ts3!=null&&a.ts!=null?a.ts3-a.ts:0,ds=a.snap3!=null&&a.snap!=null?(a.snap3-a.snap)/100:0;return {p,a,s:Math.max(dt*2,ds)};}).filter(x=>x.s>=.08).sort((a,b)=>b.s-a.s);

  for(const g of NFLS){if(g.wk!==S.week||!g.day)continue;const d=new Date(g.day+"T12:00:00Z"),y=d.getUTCFullYear();const nov1=new Date(Date.UTC(y,10,1)),fsn=1+((7-nov1.getUTCDay())%7),mar1=new Date(Date.UTC(y,2,1)),ssm=1+((7-mar1.getUTCDay())%7)+7;
    const dst=d>=new Date(Date.UTC(y,2,ssm))&&d<new Date(Date.UTC(y,10,fsn));const k=Date.parse(`${g.day}T${(g.time||"13:00")}:00${dst?"-04:00":"-05:00"}`);if(!isFinite(k))continue;if(now>=k&&now<=k+4.2*3600e3&&!g.final){teams.add(g.a);teams.add(g.h);}}

function pickWhy(xs,lv){if(!xs.length)return null;const pos=xs.filter(x=>x.v>0).sort((a,b)=>b.v-a.v),neg=xs.filter(x=>x.v<0).sort((a,b)=>a.v-b.v);
  if(lv==="High")return (pos[0]||xs[0]).t;if(lv==="Low")return (neg[0]||xs[0]).t;return neg[0]&&pos[0]?`${pos[0].t}, but ${neg[0].t}`:(neg[0]||pos[0]).t;}
confShort=function(p,R){let s=0;const X=[];const add=(v,t)=>{s+=v;X.push({v,t});};const v=VAL.v[p.id]||{},a=p.adv||{};
  if(p.inj&&ABS.test(p.inj))add(-1.2,`currently ${statusWord(p.inj).replace(/^is /,"")}`);else if(p.inj)add(-.5,`listed ${p.inj.split(" ")[0].toLowerCase()}`);

finder=function(){const L=S.L;if(!L||L.rip)return [];const key=(L._ctx&&L._ctx.k)+"|fd2"+S.asTi;if(L._fd&&L._fd.k===key)return L._fd.v;

    const ev=(send,get,type)=>{const mIn=get.reduce((s,a)=>s+M(a),0),mOut=send.reduce((s,a)=>s+M(a),0);if(!mIn||!mOut||Math.abs(mIn-mOut)/Math.max(mIn,mOut)>.3)return;
      const gMe=eff(get.map(a=>V(mi,a,true)))-eff(send.map(a=>V(mi,a,false))),gThem=eff(send.map(a=>V(c.ti,a,true)))-eff(get.map(a=>V(c.ti,a,false)));

    for(const q of mine)for(const k of myPk)for(const p of theirs){if(p.p.val<=q.p.val)continue;ev([q,k],[p],"picks");}

    const used=new Set();for(const t of Object.keys(byT)){let n=0;for(const x of byT[t]){const sig=x.send.concat(x.get).map(a=>a.id).sort().join(",");if(used.has(sig))continue;const uses=[...x.send,...x.get].filter(a=>a.k==="p").map(a=>a.id);if(out.filter(o=>o.c===c&&uses.some(u=>[...o.send,...o.get].some(a=>a.id===u))).length>=2)continue;used.add(sig);out.push(x);if(++n>=3)break;}}}

    const against=fa.filter(x=>x.v<0).concat(fb.filter(x=>x.v>0)).sort((x,y)=>Math.abs(y.v)-Math.abs(x.v))[0];
    return {a,b,A,B,d,pw,why,against,conf:pw>=.7?["Strong","good"]:pw>=.58?["Lean",""]:["Toss-up","muted"]};}}
function ssCard(x,close){const ln=p=>esc(p.name.replace(/\s+(Jr\.?|Sr\.?|II|III|IV|V)$/,"").split(" ").slice(-1)[0]);const mx=Math.max(x.A.m+x.A.sd,x.B.m+x.B.sd,1);
  const bar=(p,P,win)=>`<div class="ssb"><span class="ssn ell">${pos(p.pos)} ${esc(p.name)}</span><span class="ssrg"><i class="rng" style="left:${(Math.max(0,P.m-P.sd)/mx*100).toFixed(1)}%;width:${(Math.min(mx,P.m+P.sd)-Math.max(0,P.m-P.sd))/mx*100}%"></i><i class="pt${win?" w":""}" style="left:${(P.m/mx*100).toFixed(1)}%"></i></span><b class="num${win?" good":""}">${f1(P.m)}</b></div>`;
  return `<div class="ssc"><div class="row sp"><div class="sst">${close?"Close call: keep":"Start"} <b data-go="player-${x.a.id}">${ln(x.a)}</b> over <b data-go="player-${x.b.id}">${ln(x.b)}</b></div><span class="cf ${x.conf[1]}">${x.conf[0]} · ${Math.round(x.pw*100)}%</span></div>
   ${bar(x.a,x.A,true)}${bar(x.b,x.B,false)}
   ${x.why.length?`<ul class="why">${x.why.map(w=>`<li><b>${ln(w.who)}:</b> ${esc(w.t)}</li>`).join("")}</ul>`:""}${x.against&&x.pw<.7?`<p class="sub" style="margin:4px 0 0">${x.against.who===x.b?`In ${ln(x.b)}’s favor`:`Working against ${ln(x.a)}`}: ${esc(x.against.t.charAt(0).toLowerCase()+x.against.t.slice(1))}.</p>`:""}</div>`;}
startSit=function(){const L=S.L;if(!L||L.rip)return "";let R;try{R=ssRecs(L);}catch(e){console.error(e);return "";}let al=[];try{al=alertsFor(R.W).filter(a=>a.lvl==="bad"&&/Empty/.test(a.msg));}catch(e){}
  const sw=R.swaps,cl=R.close;
  return `<section class="pan"><div class="row sp"><h2>Start/Sit</h2><span class="tag">Hashmark model ${info("ss")}</span></div>
   ${al.map(a=>`<div class="ssr"><span class="pill hot">Fix</span><div><div class="t">${esc(a.msg)}</div>${a.fix?`<div class="s">${esc(a.fix)}</div>`:""}</div></div>`).join("")}
   ${sw.length?`<p class="sub" style="margin:2px 0 8px">Hashmark recommends ${sw.length} change${sw.length===1?"":"s"}. Moving players who already played isn’t possible, so they’re left out.</p>${sw.map(x=>ssCard(x,false)).join("")}`:`<p class="sub" style="margin:2px 0 8px"><b class="good">Your lineup is already Hashmark’s best lineup.</b></p>`}
   ${cl.length?`<div class="eyebrow mt">Closest calls</div>${cl.map(x=>ssCard(x,true)).join("")}`:""}
   <p class="sub mt">Dot: Hashmark projection. Bar: likely range. Percent: chance the first player outscores the second.</p></section>`;};
DEFS.ss=["Hashmark Start/Sit","Each player’s projection starts from Sleeper’s weekly projection in your scoring, then adjusts for recent form, usage trends (targets, snaps, expected points), the opponent’s defense against his position, his team’s implied points, weather, sportsbook player lines and practice or injury status. The percentage is the chance the recommended player outscores the other, from both players’ projections and how much each one’s scoring usually swings."];

/* traffic-light data colors: green good, yellow middling, red bad */
const TLF=".bar>i,.pbar>i,.ht>i,.mb>i,.hvb>i,.tsb .bar>i";
function tlPaint(root){if(!root)return;root.querySelectorAll(TLF).forEach(i=>{const w=parseFloat(i.style.width);if(!isFinite(w))return;
  const box=i.closest("section,.pan,.rtile,.tile,.scard");const h2=box&&box.querySelector("h2,.tn");const inv=!!i.closest(".rkrisk")||/risk|exposure|volatil|chop/i.test(h2?h2.textContent:"");
  const v=inv?100-w:w;i.style.setProperty("background",v>=60?"var(--tl-g)":v>=35?"var(--tl-y)":"var(--tl-r)","important");});
  root.querySelectorAll(".score").forEach(s=>{const n=parseFloat(s.textContent);if(!isFinite(n))return;s.classList.remove("good");s.style.color=n>=60?"var(--tl-g)":n>=40?"var(--tl-y)":"var(--tl-r)";});}
decorate=(function(prev){return function(root){prev(root);try{tlPaint(root);}catch(e){}};})(decorate);
openSheet=(function(prev){return function(t,html){const r=prev(t,html);try{tlPaint(document.getElementById("sheetB"));}catch(e){}return r;};})(openSheet);
gauge=(function(prev){return function(r){return prev(r).replace('<stop offset="0" stop-color="var(--acc)"/><stop offset=".55" stop-color="var(--muted)"/><stop offset="1" stop-color="var(--bad)"/>','<stop offset="0" stop-color="var(--tl-g)"/><stop offset=".5" stop-color="var(--tl-y)"/><stop offset="1" stop-color="var(--tl-r)"/>');};})(gauge);

/* ===== boot ===== */
function boot(){Object.keys(AGE).forEach(k=>delete AGE[k]);Object.assign(AGE,JSON.parse(JSON.stringify(AGE0)));S.ageSrc="standard age-curve priors";S.mode="snapshot";S.week=8;S.season=2026;buildSnapshot();buildOpp();S.fmt={type:"dynasty",qb:"sf"};S.leagues=[buildDemo()];selectLeague("demo");}
setInterval(()=>{if(route()!=="home"||!$("#newsH")||!$("#sheet").hidden||!$("#pal").hidden)return;S.newsI=(S.newsI+1)%NEWS.length;const n=NEWS[S.newsI];const h=$("#newsH");h.classList.remove("fadein");void h.offsetWidth;h.classList.add("fadein");h.textContent=n.h;$("#newsS").textContent=n.src;$("#newsD").textContent=n.d;$("#newsDots").innerHTML=NEWS.map((_,i)=>`<i class="${i===S.newsI?"on":""}"></i>`).join("");},6500);
window.addEventListener("hashchange",render);
boot();render();fitHeader();NW.at=Date.now();loadNews();loadAdv();loadValues();
gateShow(LS.get("hm_user")?"restore":"form");
probeLive().then(ok=>{S.canLive=ok;if(!ok){gateShow("form");return;}const u=LS.get("hm_user");if(u&&S.mode!=="live")connectSleeper(u).then(()=>{gateHide();go("home");render();}).catch(()=>gateShow("form"));else gateShow("form");});
</script>
